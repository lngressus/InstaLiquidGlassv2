name: Build InstaLiquidGlass APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LSPosed API 102 Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias liquidglass \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=InstaLiquidGlass, OU=Xposed, O=OpenSource, L=Tashkent, C=UZ"

      - name: Build Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=liquidglass \
            -Pandroid.injected.signing.key.password=android123

      - name: Prepare Output Directory
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/InstaLiquidGlass-debug.apk || true
          cp app/build/outputs/apk/release/*.apk dist/InstaLiquidGlass-release.apk || true
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstaLiquidGlass-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
